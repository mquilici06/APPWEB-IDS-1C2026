<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin</title>
    <link rel="stylesheet" href="../static/styles/admin-login.css">
</head>
<body>
    <div class="caja-centro">
            <div class="caja-formulario">
                <img id="foto" src="../static/images/icon.png" alt="Foto logo">

                <form id="form-login" action="http://127.0.0.1:5000/admin/login" method="POST">
                    <input class="em-psw" type="email" name="email" placeholder="Email">
                    <input class="em-psw" type="password" name="contrasena" placeholder="Contraseña">
                    <button id="boton-enviar" type="submit">Iniciar sesión</button>
                </form>
        </div>
    </div>
</body>
</html>
