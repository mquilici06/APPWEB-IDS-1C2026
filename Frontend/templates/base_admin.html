{% extends "base.html" %}

{% block title %}Panel Admin - Altezza{% endblock %}

{% block estilos %}
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/admin.css')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/menu.css')}}">
{% endblock %}

{% block content %}
<div class="caja-total-admin" style="display: flex; min-height: 70vh;">
    
    <aside class="admin-sidebar" style="width: 250px; border-right: 2px solid #ccc; padding: 20px;">
        <h2>Menú Admin</h2>
        <ul style="list-style: none; padding: 0;">
          <li style="margin-bottom: 15px;">
            <a href="{{ url_for('rutas_prefijo_api.admin_reservas') }}">Gestionar Reservas</a>
          </li>
          <li style="margin-bottom: 15px;">
            <a href="#">Gestionar Menú</a>
          </li>
          <li style="margin-bottom: 15px;">
            <a href="{{ url_for('rutas_prefijo_api.admin_resenas') }}">Gestionar Reseñas</a>
          </li>
        </ul>
    </aside>

    <main class="admin-contenido main" style="flex-grow: 1; padding: 30px;">
        {% block admin_content %}
            {% endblock %}
    </main>

</div>
{% endblock %}
