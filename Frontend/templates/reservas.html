{% extends "base.html" %}
 
{% block title %}Reservas{% endblock %}
 
{% block estilos %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/reservas.css') }}">
{% endblock %}
 
{% block content %}
 
<section class="hero">
    <div class="hero-content">
        <div class="hero-caja">
            <h1 class="hero-titulo">Reservas</h1>
            <p class="hero-subtitulo">¡Reserva tu lugar para dejar de esperar!</p>
        </div>
    </div>
</section>
 
<section class="reservas-contenido">
 
    <div class="reservas-columna">
        <h2 class="seccion-titulo">Elegí tu fecha</h2>
        <div class="fecha-selector">
            <input type="date" name="fecha_reserva" class="colocar-calendario" >
        </div>
    </div>
 
    <div class="reservas-columna">
        <h2 class="seccion-titulo">Completá tus datos</h2>
 
        <div id="form-mensaje" class="form-mensaje oculto"></div>
 
        <form id="form-reserva" novalidate>
 
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Tu nombre y apellido" required>
            </div>
 
            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono"
                       placeholder="Ej: +54 11 9999-9999" required>
            </div>
 
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="tucorreo@email.com" required>
            </div>
 
            <div class="campo">
                <label for="personas">Cantidad de personas</label>
                <select id="personas" name="personas" required>
                    <option value="" disabled selected>Seleccioná</option>
                    <option value="1">1 persona</option>
                    <option value="2">2 personas</option>
                    <option value="3">3 personas</option>
                    <option value="4">4 personas</option>
                    <option value="5">5 personas</option>
                    <option value="6">6 personas</option>
                    <option value="7">7 personas</option>
                    <option value="8">8 personas</option>
                </select>
            </div>
 
            <div class="campo">
                <label for="notas">Notas especiales (opcional)</label>
                <textarea id="notas" name="notas"
                          placeholder="Alergias, ocasión especial, pedidos particulares..."
                          rows="4" maxlength="300"></textarea>
                <span id="contador-notas">0 / 300</span>
            </div>
 
            <button type="submit" class="boton-enviar" id="btn-enviar" disabled>Confirmar reserva</button>
        </form>
    </div>
 
</section>
{% endblock %}
