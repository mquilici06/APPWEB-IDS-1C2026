x-db-password: &db-password ${DB_PASSWORD:-rootpassword}

services:
  backend:
    build:
      context: .
      dockerfile: Backend/dockerfile
    container_name: altezza_backend
    ports:
      - "5002:5000"
    volumes:
      - ./Backend:/app
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: *db-password
      DB_NAME: altezza
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Frontend/dockerfile
    container_name: altezza_frontend
    ports:
      - "5001:5001"
    volumes:
      - ./Frontend:/app
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: altezza_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: *db-password
      MYSQL_DATABASE: altezza
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Backend/database/__init__.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: altezza_mysql_data
